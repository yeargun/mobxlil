# Compiler-owned delivery; no JavaScript post-minifier or export rewriting.
[policy]
version = 3
[package]
name = "mobxlil"
version = "7.0.0"
abi = 1
entry = "src/mobx.lil"
[optimization]
preset = "maximum"
call_site_specialization = true
[javascript]
priority = "size-first"
# Assumes unpatched platform builtins; disable when consumers replace them.
assume_pristine_builtins = false
# Remove debugLog instrumentation; ordinary print and host console effects remain.
strip_debug = true
compression = ["identifier-mangling", "property-mangling", "string-pooling", "string-array-packing", "parameterized-function-merging"]

# Preserved effort setting. 13 favors size; 14/15 allow more expensive marginal searches.
[effort]
level = 15

# Optimize the delivered files for this codec, independently of raw/gzip objectives.
[objective]
codecs = "brotli"
[mangle]
identifiers = true
properties = true
pool_strings = true

# DEV controls assertions and diagnostics; compression effort never changes it.
[defines]
DEV = false
[delivery]
mode = "single"
directory = "."
entry_names = "mobx.esm.production.min.js"
[delivery.entries]
mobx = "../src/mobx.lil"
[[delivery.also]]
name = "cjs"
format = "cjs"
entry_names = "mobx.cjs.production.min.js"
[[delivery.also]]
name = "browser"
format = "umd"
global = "mobx"
global_binding = "property"
entry_names = "mobx.umd.production.min.js"

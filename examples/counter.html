<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Counter · mobxlil</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <main class="wrap">
      <nav class="nav">
        <a href="./index.html">Examples</a>
        <a href="./counter.html" aria-current="page">Counter</a>
        <a href="./todos.html">Todos</a>
        <a href="./cart.html">Cart</a>
        <a href="./search.html">Search</a>
        <a href="./reactions.html">Reactions</a>
      </nav>
      <h1>Counter</h1>
      <p class="lede">An observable box, a computed double, and an autorun that paints the DOM.</p>
      <div class="card">
        <div class="stat"><span>Value</span><strong id="value">0</strong></div>
        <div class="stat"><span>Doubled</span><strong id="doubled">0</strong></div>
        <div class="stat"><span>Autorun ticks</span><strong id="ticks">0</strong></div>
      </div>
      <div class="row">
        <button id="dec">−1</button>
        <button id="inc">+1</button>
        <button class="ghost" id="reset">Reset</button>
      </div>
    </main>
    <script type="module">
      import { observable, computed, autorun, action } from "/dist/mobx.esm.js";

      const count = observable.box(0);
      const doubled = computed(() => count.get() * 2);
      let ticks = 0;

      autorun(() => {
        ticks += 1;
        document.getElementById("value").textContent = String(count.get());
        document.getElementById("doubled").textContent = String(doubled.get());
        document.getElementById("ticks").textContent = String(ticks);
      });

      const bump = action(delta => {
        count.set(count.get() + delta);
      });

      document.getElementById("inc").onclick = () => bump(1);
      document.getElementById("dec").onclick = () => bump(-1);
      document.getElementById("reset").onclick = action(() => count.set(0));
    </script>
  </body>
</html>
